<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'das quantenkomplott2-41.jpg', alt: "Das ElektronEs gibt jetzt einen kurzen Ausblick in die Wissenschaft der kleinsten Teilchen, der freilich übersprungen werden kann. Hier wird eine tiefe Schlucht aufgesprengt, die man jetzt vielleicht noch nicht kennen muss. Aber wer weiß, ob sich innerhalb der Leserschaft nicht neue Denker verstecken und sich auf den Weg machen wollen, neue Einblicke freizusetzen.Die Begrifflichkeit „Verbundkräfte der Elektronen“ beschreibt im physikalischen und chemischen Kontext die fundamentalen Wechselwirkungen, Kräfte und quantenmechanischen Effekte, die dafür sorgen, dass Elektronen an Atomkerne gebunden, in Molekülen als Elektronenpaare stabilisiert oder in Festkörpern zu kollektiven Verbänden (wie in Leitungsbändern oder Supraleitern) geordnet werden. Alles klar und fundamental. Wechselwirkungen (natürlich auch virtuell), Quantenmechanische Absonderlichkeiten, Kräfte der einen oder" },
            { src: 'das quantenkomplott2-42.jpg', alt: "anderen Art und Elektronenpaare, die eben nun gebunden sind in Leitungsbändern oder diesen ominösen Supraleitern.Bisher wurde nichts neues gesagt, eben nur umschrieben. Dieses Phänomen lässt sich physikalisch in vier zentrale Wirkungsmechanismen unterteilen. Man möchte mein Kurzfassung hier möglichst verzeihen. Schließlich möchte ich als Qantimedus nicht zu wissenschaftlich wirken und abschreiben will ich schon gar nicht.:1. Elektrostatische Kern-Anziehung (Coulomb & Quanten-Stabilität)Die Basis ist die elektromagnetische Anziehung zwischen negativer Hülle und positivem Kern. Dass das Elektron nicht in den Kern stürzt, garantiert erst das Modell der Quantenmechanik: Es fixiert das Elektron als stehende Welle in quantisierten Aufenthaltsräumen (Orbitalen).Das Durcheinander hier sprichwörtlich undenkbar. Jetzt kommt doch wahrlich die elektromagnetische Anziehung ins Gespräch, die Sichtbarwerdung des Modelles der Quantenmechanik wird erwähnt, die stehende Welle und die Quantisierung dient als Begründung nur die erste fundamentale Basis. Ein kleines Wort zu der elektromagnetischen Anziehung sei noch gestattet.Eine elektromagnetische Anziehung ist eine anziehende Kraft zwischen elektrisch geladenen Teilchen oder magnetischen Polen. Ursachen sind wie folgt, die elektrische Anziehung, da sich" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
