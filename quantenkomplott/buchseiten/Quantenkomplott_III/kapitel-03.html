<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-03.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>

    <!--HREFLANG_START-->
    <link rel="alternate" hreflang="x-default" href="https://quantimedus.de/quantenkomplott/buchseiten/Quantenkomplott_III/kapitel-03.html">
    <!--HREFLANG_ENDE-->
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Quantenkomplott III-23.jpg', alt: "Der Lichtenberg-Figuren-Effekt im FestkörperGeorg Christoph Lichtenberg hat den Effekt 1777 auf einer Isolator-Platte, die mit feinem Staub bestreut war, entdeckt. Offiziell läuft das Experiment heute unter den Namen 3D-Lichtenberg-Entladung. Mit Hilfe dieser Elektronenstrahl-Lithografie (Captured Lightning) produziert man Lehrmittel aus Acryl-Blöcke.Ein echte dreidimensionale Lichtenberg-Entladung stellt man folgender Maßen her:Ein Acryl-Block wird vor das Austrittsfenster eines Linearbeschleunigers (Linacs) gestellt. Der Beschleuniger erzeugt einen gebündelten Strahl aus hochenergetischer Strahlung (typischerweise im Bereich von 3 bis 5 MeV). Da Acrylglas einen extrem hohen spezifischen Widerstand besitzt, fließen die eingebrachten Feldpotenziale nicht ab. Im Inneren baut sich eine massive homogene Raumladungszone auf. Nach dem Verlassen der Bestrahlungskammer ist der Block optisch völlig unauffällig.Man schlägt anschließend mit einem spitzen Nagel sanft an eine Kante des Blocks. Im Bruchteil einer Mikrosekunde entlädt sich" },
            { src: 'Quantenkomplott III-24.jpg', alt: "die im Kunststoff gebundene Feldenergie in einem gleißenden Blitz. Zurück bleibt im Inneren des festen Glases ein verästelter, dreidimensionaler „Fraktal-Blitz“ aus mikroskopischen Kanal-Rissen. Die elektrische Energie war nicht flüchtig im Raum „unterwegs“, viel mehr im inneren Atomgitter des Isolators wie in einer gespannten mechanischen Feder arretiert. Der Impuls an der Kante löst eine Lawine aus, die die Raumstruktur schlagartig mechanisch zerrüttet.Was der Beschleuniger in das Material schießt, ist ein extrem hochfrequenter Impuls elektromagnetischer Energiedichte. Dieser Impuls erzeugt eine kaskadenartige Verschiebung der elektrischen Raumspannung im Inneren des Dielektrikums.Die eingebrachte Energie bringt die Elektronenwolken des Kunststoffs lokal extrem aus dem Gleichgewicht. Anstatt dass „fremde Elektronen“ eingepflanzt werden, entsteht in einer bestimmten Tiefe eine Zone maximaler Gitter-Verzerrung (Spannungs-Gradient). Das Material wird nicht wie ein Sack mit Flöhe gefüllt, stattdessen wie eine hochkomprimierte mechanische Feder zusammengedrückt. Die Energie steckt im gestörten Raumzustand innerhalb des Glases, nicht aber in der „Masse“ der eingedrungenen Strahlung.Hier folgt ein Beispiel wie sorglos und krass man 2026 mit diesen vor 200 Jahren entdeckten Naturschauspielen umgeht. Sucht man im Netzt nach Linearbeschleuniger wird jedem folgendes in google mit KI-Unterstützung unterbreitet:" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
