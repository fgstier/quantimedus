<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-05.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>

    <!--HREFLANG_START-->
    <link rel="alternate" hreflang="x-default" href="https://quantimedus.de/quantenkomplott/buchseiten/Quantenkomplott_I/kapitel-05.html">

</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'das quantenkomplott 1-61.jpg', alt: "Das Leitungs-DilemmaBevor ich weitermache, sollten wir noch den Strom aus dem Kopf verbannen. Wer verstanden hat, wie Elektronen von A nach B in einem Stromkreislauf wandern und all die schönen Leitungseffekte beschreibbar machen, sei vorgewarnt. Wer mit dem nun folgendem Wissen weiterhin in der Lage ist, Wechselstromkomponenten und imaginäre Stromvektoren zeichnen zu können, dem sei sein hartes Stehvermögen an Überzeugung anzuerkennen.Bisher konnte man mit einfachen Modellen Ströme berechnen und verstand auch, warum ein Schalter eine Lampe zum Glühen bringt. Wer sich den physikalischen Forschungsergebnissen hingibt, versteht dann allerdings auch nicht mehr, warum er mal etwas verstanden hat.Wer also bis hierher glaubte, Elektrizität sei schlicht das Vorwärtsströmen kleiner geladener Teilchen durch ein Messing- oder Kupferrohr, muss jetzt starke Nerven bewahren. Die makroskopische Gemütlichkeit des Ohm’schen Gesetzes bricht an dieser Stelle unvermeidbar zusammen. Das klassische Modell scheitert bereits an einer banalen Messgröße der" },
            { src: 'das quantenkomplott 1-62.jpg', alt: "Driftgeschwindigkeit der Elektronen. In einem gewöhnlichen Kupferdraht bewegen sich die Elektronen im Gleichstromfall mit einem lächerlichen Tempo von etwa 1 mm/s vorwärts – langsamer als eine Weinbergschnecke. Betätigt man jedoch am Ende einer kilometerlangen Leitung den Lichtschalter, brennt die Lampe nahezu augenblicklich. Bei Wechselstrom 50-60Hz schwingen die Elektronen lediglich um Bruchteile eines Mikrometers hin und her. Sie legen netto keinen einzigen Millimeter Wegstrecke in Richtung des Verbrauchers zurück. Wer nun behauptet, der „Strom fließt“, müsste erklären, wie ein Teilchen, das sich kaum vom Fleck bewegt, Energie über Kilometer hinweg transportiert.Die physikalische Realität ist dennoch weitaus radikaler: Die Energie fließt nicht im Kupferleiter. Die Energie schleicht sich im Raum um den Leiter herum. Der Kupferdraht ist kein Rohr für Elektronen. Er ist lediglich ein Führungsdraht (eine Richtlinie) für das elektromagnetische Feld. Die transportierte Leistung wird durch das Kreuzprodukt (siehe Vektor-Rechnung oder Band III) aus elektrischem Feld und magnetischem Feld beschrieben. Sobald die Spannung anliegt, baut sich zwischen Hin- und Rückleiter ein elektrisches Feld auf, während der minimale Ladungsträgerversatz ein umgebendes Magnetfeld induziert." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
