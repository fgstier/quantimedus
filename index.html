
<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantimedus | F.G. Stier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0a0d14',
              dark: '#121824',
              accent: '#00f0ff',
              purple: '#7000ff',
              pink: '#ff007f'
            }
          },
          animation: {
            'quantum-pulse': 'quantumPulse 3s infinite ease-in-out',
            'cyber-glitch': 'glitch 2s infinite'
          },
          keyframes: {
            quantumPulse: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2)' },
              '50%': { boxShadow: '0 0 30px rgba(112, 0, 255, 0.7), inset 0 0 20px rgba(255, 0, 127, 0.4)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .auto-quantum-btn {
      background: linear-gradient(-45deg, #00f0ff, #7000ff, #ff007f, #00f0ff);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite, quantumPulse 3s infinite ease-in-out;
    }
    .grid-bg {
      background-image: linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="bg-cyber-black text-slate-200 font-mono min-h-screen flex flex-col justify-between grid-bg relative overflow-x-hidden">

  <!-- Background Ambient Glow -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyber-purple/20 blur-[120px] pointer-events-none rounded-full"></div>

  <!-- Header -->
  <header class="w-full border-b border-cyber-accent/20 bg-cyber-dark/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-cyber-accent text-2xl font-bold tracking-widest uppercase">QUANTIMEDUS</span>
      <span class="text-xs text-cyber-pink border border-cyber-pink/40 px-2 py-0.5 rounded uppercase tracking-wider">v1.0.0</span>
    </div>
    <nav class="space-x-6 text-sm text-slate-400">
      <a href="#about" class="hover:text-cyber-accent transition-colors">System</a>
      <a href="#works" class="hover:text-cyber-accent transition-colors">Werke</a>
      <a href="#contact" class="hover:text-cyber-accent transition-colors">Terminal</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <main class="container mx-auto px-6 py-16 flex-grow flex flex-col items-center justify-center text-center relative z-10">
    <div class="inline-block mb-4 px-4 py-1 rounded-full border border-cyber-accent/30 bg-cyber-accent/10 text-cyber-accent text-xs tracking-widest uppercase">
      Philosophische Dekonstruktion &amp; Technische Cybernetik
    </div>
    
    <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-6">
      F.G. STIER <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyber-accent via-cyber-purple to-cyber-pink">| QUANTIMEDUS</span>
    </h1>

    <p class="max-w-2xl text-slate-400 text-base md:text-lg mb-10 leading-relaxed">
      Als technischer Autor nutze ich die inimitable temptation der Worte als Bildmaschine.
    </p>

    <!-- Interactive Quantum Button -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <a href="https://fgstier-art.de" target="_blank" class="auto-quantum-btn text-white font-bold px-8 py-4 rounded-lg uppercase tracking-wider transform hover:scale-105 transition-all duration-300 border border-white/20">
        Compiler-Dialog Starten
      </a>
      <a href="https://arkusnat.de" target="_blank" class="px-8 py-4 rounded-lg bg-cyber-dark text-cyber-accent border border-cyber-accent/40 hover:bg-cyber-accent/10 transition-all duration-300 font-bold uppercase tracking-wider">
        Arkusnat.de
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full border-t border-cyber-accent/20 bg-cyber-dark/60 py-6 text-center text-xs text-slate-500">
    <p>© 2026 F.G. Stier. Alle Rechte vorbehalten. #ARKUSNAT</p>
  </footer>

</body>
</html>
